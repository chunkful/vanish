stages:
  - publish

gradle-publish:
  stage: publish
  image: gradle:jdk25-alpine
  before_script:
    - 'export GRADLE_USER_HOME="$CI_PROJECT_DIR/.gradle"'
  script: 'gradle publish -Pversion=$CI_COMMIT_TAG --build-cache'
  cache:
    key: '$CI_COMMIT_REF_NAME'
    paths:
      - '.gradle'
  artifacts:
    paths:
      - 'build'
  rules:
    - if: $CI_COMMIT_TAG